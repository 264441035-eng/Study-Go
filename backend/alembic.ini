# Alembic 設定。接続先 URL は env.py で環境変数 DATABASE_URL から設定するため、
# ここには sqlalchemy.url を書かない（誤ってローカル URL を固定しないため）。
[alembic]
script_location = migrations
prepend_sys_path = .
# マイグレーションファイル名: <連番rev>_<slug>.py を分かりやすくする
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
