name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC で AWS ロールを assume するために id-token: write が必要
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECS_CLUSTER: study-go-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      # backend が落ちても frontend は続行できるよう fail-fast を無効化
      fail-fast: false
      matrix:
        include:
          - name: backend
            service: study-go-backend
            family: study-go-backend
            container: backend
            ecr: study-go-backend
            context: ./backend
          - name: frontend
            service: study-go-frontend
            family: study-go-frontend
            container: frontend
            ecr: study-go-frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          # HTTPリファラー制限をかけた公開用キー（秘密鍵ではない）。ビルド時に埋め込む。
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          IMAGE="$REGISTRY/${{ matrix.ecr }}:${{ github.sha }}"
          BUILD_ARGS=()
          if [ "${{ matrix.name }}" = "frontend" ]; then
            BUILD_ARGS+=(--build-arg "VITE_GOOGLE_MAPS_API_KEY=$VITE_GOOGLE_MAPS_API_KEY")
          fi
          docker build "${BUILD_ARGS[@]}" -t "$IMAGE" -t "$REGISTRY/${{ matrix.ecr }}:latest" ${{ matrix.context }}
          docker push "$IMAGE"
          docker push "$REGISTRY/${{ matrix.ecr }}:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Terraform 管理の現行 task definition を取得し、新イメージだけ差し替える
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ matrix.family }} \
            --query taskDefinition > task-def.json

      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ matrix.container }}
          image: ${{ steps.build.outputs.image }}

      # ---- frontend など: そのまま deploy ----
      - name: Deploy to ECS
        if: matrix.name != 'backend'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ---- backend: 新イメージの task def を登録 → スキーマ初期化を one-off タスクで先に実行 →
      #      成功した場合のみ service を更新する（migration 失敗は deploy をブロック）----
      - name: Register task definition (backend)
        if: matrix.name == 'backend'
        id: register
        run: |
          # render 出力から register 不可の読み取り専用フィールドを除去して登録
          jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            "${{ steps.render.outputs.task-definition }}" > register.json
          TD_ARN=$(aws ecs register-task-definition --cli-input-json file://register.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "td_arn=$TD_ARN" >> "$GITHUB_OUTPUT"

      - name: Run DB migration as one-off task (backend)
        if: matrix.name == 'backend'
        run: |
          # 実行中サービスと同じネットワーク構成(private subnet / SG)を流用する
          NETCFG=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services ${{ matrix.service }} \
            --query 'services[0].networkConfiguration' --output json)
          TASK_ARN=$(aws ecs run-task --cluster "$ECS_CLUSTER" \
            --task-definition "${{ steps.register.outputs.td_arn }}" \
            --launch-type FARGATE \
            --network-configuration "$NETCFG" \
            --overrides '{"containerOverrides":[{"name":"${{ matrix.container }}","command":["python","-m","app.dbctl","init-db"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='${{ matrix.container }}'].exitCode | [0]" --output text)
          echo "migration exitCode: $EXIT"
          if [ "$EXIT" != "0" ]; then
            REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' --output text)
            echo "::error::DB migration が失敗しました (exitCode=$EXIT, reason=$REASON)。deploy を中止します。"
            exit 1
          fi

      - name: Deploy to ECS (backend)
        if: matrix.name == 'backend'
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service ${{ matrix.service }} \
            --task-definition "${{ steps.register.outputs.td_arn }}"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services ${{ matrix.service }}
