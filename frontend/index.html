<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home">

        <!-- 上部バー：レベル/経験値 と 振り返り(チャット)ボタン -->
        <header class="home-header">
            <div class="level-block">
                <h1>Lv. <span id="level">--</span></h1>
                <!-- 経験値（進化まで）バー -->
                <div class="xp-bar" aria-label="次の進化までの経験値">
                    <div class="xp-bar-fill" id="xpBarFill"></div>
                </div>
                <p class="xp-label" id="xpLabel">次の進化まで --</p>
            </div>

            <!-- 右上：学んだことを振り返る（チャットへ） -->
            <button class="reflect-button"
                    onclick="location.href='chat.html#/chat'">
                <img src="images/chat.png" alt="">
                <span>振り返る</span>
            </button>
        </header>

        <!-- デモ用：レベルを初期状態へリセットする -->
        <button class="reset-button" id="resetButton">
            レベルをリセット（デモ用）
        </button>

        <!-- 今日の勉強時間 -->
        <p class="study-time">
            今日の勉強時間：<span id="studyTime">--</span>
        </p>

        <!-- キャラの状態メッセージ -->
        <p class="status" id="status">読み込み中…</p>

        <!-- キャラクター（進化段階に応じて画像が切り替わる） -->
        <div class="character">
            <img id="characterImage" src="images/deformed.png" alt="キャラクター">
        </div>

        <!-- 勉強ボタン -->
        <button class="study-button" onclick="location.href='study.html'">
            <img src="images/study.png" alt="">
            <span>勉強</span>
        </button>

        <!-- 下のメニューボタン -->
        <div class="menu-buttons">

            <button class="menu-button map-button"
                    onclick="location.href='map.html'">
                <img src="images/map.png" alt="">
                <span>拠点</span>
            </button>

            <button class="menu-button task-button"
                    onclick="location.href='task.html'">
                <img src="images/task.png" alt="">
                <span>タスク</span>
            </button>

            <button class="menu-button pass-button"
                    onclick="location.href='pass.html'">
                <img src="images/pass.png" alt="">
                <span>すれちがい</span>
            </button>

        </div>

    </main>

    <script type="module" src="./home.ts"></script>
</body>
</html>
