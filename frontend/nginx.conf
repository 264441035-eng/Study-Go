server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: 未知パスや /chat.html /chat も index.html を返す
    location = /chat.html {
        try_files /index.html =404;
    }

    location = /chat {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ローカル(docker-compose)では /api をバックエンドへプロキシ。
    # 本番では ALB がパスルーティングするため、このロケーションには到達しない。
    # 変数 + resolver でupstream未解決時も nginx が起動時にクラッシュしないようにする。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
