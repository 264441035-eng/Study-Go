services:
  backend:
    build: ./backend
    environment:
      # フロント(nginx:8080)からの同一オリジンプロキシ経由なのでCORSは基本不要だが、
      # 直接叩く場合のために許可オリジンを設定。
      CORS_ORIGINS: "http://localhost:8081,http://localhost:5173"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"
