services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studygo
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      CORS_ORIGINS: "http://localhost:8081,http://localhost:5173"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/studygo"
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"